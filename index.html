<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hela Osu Weda Gedara Channeling System</title>
    <script>
        (function() {
            try {
                var session = JSON.parse(localStorage.getItem('hela_osu_session'));
                if (session && session.role) {
                    if (session.role === 'admin') {
                        window.location.replace('admin.html');
                    } else if (session.role === 'doctor') {
                        window.location.replace('doctor.html');
                    } else {
                        window.location.replace('patient.html');
                    }
                } else {
                    window.location.replace('login.html');
                }
            } catch(e) {
                window.location.replace('login.html');
            }
        })();
    </script>
</head>
<body style="font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f8fafc; color: #475569;">
    <div style="text-align: center;">
        <div style="font-size: 3rem; margin-bottom: 1rem;">🌿</div>
        <h2>Loading Hela Osu Weda Gedara...</h2>
        <p>Redirecting to your portal...</p>
    </div>
</body>
</html>
